<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danke – BZM Store</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="cart.css" />
  <style>
    .thanks-page { min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 6rem 1.5rem 3rem; text-align: center; }
    .thanks-box { max-width: 480px; width: 100%; border-radius: 20px; padding: 2.5rem 2rem; }
    .thanks-icon { width: 72px; height: 72px; margin: 0 auto 1.25rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; background: rgba(87,242,135,0.15); color: #57f287; border: 1px solid rgba(87,242,135,0.35); }
    .thanks-box h1 { font-size: 1.75rem; font-weight: 800; margin-bottom: 0.75rem; }
    .thanks-box p { color: var(--text-muted); margin-bottom: 1rem; line-height: 1.6; }
    .thanks-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
  <nav class="navbar glass">
    <div class="nav-container">
      <a href="/" class="logo" aria-label="BZM Store">
        <svg class="logo-svg" viewBox="0 0 220 40" xmlns="http://www.w3.org/2000/svg" role="img">
          <defs><linearGradient id="bzGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ef4444"/><stop offset="50%" stop-color="#f97316"/><stop offset="100%" stop-color="#fb923c"/>
          </linearGradient></defs>
          <text x="0" y="30" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="url(#bzGrad)">BZM</text>
          <text x="66" y="30" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff">STORE</text>
        </svg>
      </a>
    </div>
  </nav>
  <main class="thanks-page">
    <div class="thanks-box glass">
      <div class="thanks-icon"><i class="fa-solid fa-check"></i></div>
      <h1>Danke für Ihre Bestellung!</h1>
      <p>Wir haben Ihre Anfrage erhalten. Prüfen Sie bitte auch Ihren E-Mail-Posteingang (und Spam).</p>
      <div class="thanks-actions">
        <a href="/services" class="btn btn-primary">Weiter einkaufen</a>
        <a href="/" class="btn btn-glass">Zur Startseite</a>
      </div>
    </div>
  </main>
  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-brand"><p>BZM Store</p></div>
        <div class="footer-col">
          <p class="footer-col-title">Hilfe</p>
          <ul class="footer-links">
            <li><a href="/">Home</a></li>
            <li><a href="/services">Shop</a></li>
            <li><a href="/impressum">Impressum</a></li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom"><p>© 2026 BZM Store</p></div>
    </div>
  </footer>
  <script src="cart.js"></script>
  <script>try { localStorage.removeItem("bzm_cart"); } catch(e) {}</script>
</body>
</html>
